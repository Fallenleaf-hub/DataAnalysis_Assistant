name: Build and Release WinUI 3 App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish WinUI 3 App (win-x64 Unpackaged)
        shell: pwsh
        run: |
          dotnet publish DataAnalysis_Assistant/DataAnalysis_Assistant.csproj `
            /p:PublishProfile=win-x64 `
            -p:PublishTrimmed=false `
            -p:PublishReadyToRun=false `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -o ./publish/DataAnalysis_Assistant

      - name: Compress Release Package
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "latest" }
          $zipName = "DataAnalysis_Assistant-$tag-win-x64.zip"
          Compress-Archive -Path ./publish/DataAnalysis_Assistant/* -DestinationPath "./$zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

